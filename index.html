<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Exact callback</title>
<style>
  :root { color-scheme: light dark; --fg: #111; --bg: #fff; --muted: #666; --line: #d8d8d8; --ok: #0a7d32; --bad: #b00020; }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #e8e8e8; --bg: #16181c; --muted: #9aa0a6; --line: #343840; --ok: #4ec46f; --bad: #ff6b81; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 40px 16px; background: var(--bg); color: var(--fg);
         font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  main { max-width: 680px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 24px; font-weight: 600; }
  .label { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 8px; }
  .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
          font-size: 15px; word-break: break-all; background: color-mix(in srgb, var(--fg) 5%, transparent);
          border: 1px solid var(--line); border-radius: 8px; padding: 14px; }
  button { margin-top: 12px; font: inherit; font-size: 15px; padding: 10px 18px; border-radius: 8px;
           border: 1px solid var(--line); background: color-mix(in srgb, var(--fg) 6%, transparent);
           color: var(--fg); cursor: pointer; }
  button:hover { background: color-mix(in srgb, var(--fg) 12%, transparent); }
  .note { color: var(--muted); font-size: 14px; margin-top: 28px; }
  .bad { color: var(--bad); }
  section { margin-bottom: 28px; }
  pre { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px;
        white-space: pre-wrap; word-break: break-all; background: color-mix(in srgb, var(--fg) 5%, transparent);
        border: 1px solid var(--line); border-radius: 8px; padding: 14px; margin: 0; }
</style>
</head>
<body>
<main>
  <h1>Exact Online — authorisation callback</h1>
  <div id="out"></div>
  <p class="note">
    This page stores nothing and sends nothing anywhere. It only reads the
    authorisation code out of the address bar so you can copy it.
    The code is single-use and expires quickly — exchange it now.
  </p>
</main>
<script>
(function () {
  const q = new URLSearchParams(location.search);
  const code = q.get('code');
  const err = q.get('error');
  const out = document.getElementById('out');

  if (err) {
    out.innerHTML = '<section><div class="label">Exact returned an error</div>' +
      '<div class="code bad"></div></section>';
    out.querySelector('.code').textContent = err + (q.get('error_description') ? ' — ' + q.get('error_description') : '');
    return;
  }

  if (!code) {
    out.innerHTML = '<section><div class="label">Nothing to show</div>' +
      '<div class="code">No <code>code</code> in the URL. Open the authorize URL in Exact first; ' +
      'you should arrive here with <code>?code=...</code> appended.</div></section>';
    return;
  }

  const curl = [
    'curl -s -X POST https://start.exactonline.nl/api/oauth2/token \\',
    '  -d grant_type=authorization_code \\',
    '  -d "client_id={YOUR-CLIENT-ID}" \\',
    '  -d "client_secret=YOUR-CLIENT-SECRET" \\',
    '  -d "redirect_uri=' + location.origin + location.pathname + '" \\',
    '  -d "code=' + code + '"'
  ].join('\n');

  const s1 = document.createElement('section');
  s1.innerHTML = '<div class="label">Authorisation code</div><div class="code"></div>' +
                 '<button type="button">Copy code</button>';
  s1.querySelector('.code').textContent = code;

  const s2 = document.createElement('section');
  s2.innerHTML = '<div class="label">Exchange it</div><pre></pre><button type="button">Copy command</button>';
  s2.querySelector('pre').textContent = curl;

  out.append(s1, s2);

  function wire(btn, text, done) {
    btn.addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(text); btn.textContent = done; }
      catch (e) { btn.textContent = 'Copy failed — select it by hand'; }
      setTimeout(() => { btn.textContent = btn.dataset.orig; }, 2000);
    });
    btn.dataset.orig = btn.textContent;
  }
  wire(s1.querySelector('button'), code, 'Copied');
  wire(s2.querySelector('button'), curl, 'Copied');
})();
</script>
</body>
</html>
